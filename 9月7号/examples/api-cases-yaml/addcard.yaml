基础配置:  #后续测试报告中显示
  用例类型: ApiCase
  用例标题: 购物车用例标题
  一级模块: 购物车模块
  二级模块: 购物车功能

用例步骤:
  - 发送购物车接口:
      操作类型: 发送请求POST   #一定要跟Keywords发请求的函数名一致
      请求地址: '{{URL}}'
      URL参数:
        s: api/cart/save
        application: app
        application_client_type: weixin
        token: '{{my_token}}'
      请求数据:
        goods_id: 2,
        stock: 1,


  - 提取响应数据msg:
      操作类型: 提取数据JSON
      表达式: $..msg
      下标: 0
      变量名: my_msg


  - 断言:
      操作类型: 断言文本
      比较符: "=="
      断言类型: "文本"
      期望结果: "加入成功"
      实际结果: "{{my_msg}}"

  - 深度断言响应结果:
      操作类型: 批量断言
      期望结果: {'msg': '加入成功', 'code': 0, 'data': 4}
      过滤字段: [ "root['data']" ]
