基础配置:  #后续测试报告中显示
  用例类型: ApiCase
  用例标题: 商城登录用例标题
  一级模块: 登录模块
  二级模块: 登录功能

前置脚本:
  - "context.update({'name':'youer'})"
#  - |
#    import random
#    context.update({'name':'youer'+str(random.randint(1000,9999))})
后置脚本: ""

用例步骤:     #具体要测试的接口内容
- 发送登陆接口:
    操作类型: 发送请求POST  #一定要跟Keywords发请求的函数名一致
    请求地址: '{{URL}}'  #加不加index.php对于这个商城项目接口都可以  如果加可以在后面加个/index.php
    URL参数:
      s: /api/user/login
      application: app
      application_client_type: weixin
    请求数据:
      accounts: "{{name}}"
      pwd: "123456"
      type: "username"

- 提取响应数据token:
    操作类型: 提取数据JSON
    表达式: $..token
    下标: 0
    变量名: my_token

- 提取响应数据msg:
    操作类型: 提取数据JSON
    表达式: $..msg
    下标: 0
    变量名: my_msg


- 断言:
    操作类型: 断言文本相等
    期望结果: "登录成功"
    实际结果: "{{my_msg}}"

- 断言:
    操作类型: 断言数字相等
    期望结果: 1
    实际结果: 1

