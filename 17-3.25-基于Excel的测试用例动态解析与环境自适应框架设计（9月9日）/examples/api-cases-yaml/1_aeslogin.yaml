基础配置:  #后续测试报告中显示
  用例类型: ApiCase
  用例标题: 登陆加密用例标题
  一级模块: 登陆加密模块
  二级模块: 登陆加密功能

前置脚本: ""
后置脚本: ""

用例步骤:     #具体要测试的接口内容

- 数据加密-密码:
    操作类型: 加密aes  #一定要跟Keywords发请求的函数名一致
    data: '123456'
    VARNAME: aes_pwd

- 数据加密-用户名:
    操作类型: 加密aes  #一定要跟Keywords发请求的函数名一致
    data: 'tony'
    VARNAME: aes_username

- 发送加密接口:
    操作类型: 发送请求POST  #一定要跟Keywords发请求的函数名一致
    请求地址: http://127.0.0.1:8080/login_safe
    请求数据:
      username: "{{aes_username}}"
      password: "{{aes_pwd}}"

