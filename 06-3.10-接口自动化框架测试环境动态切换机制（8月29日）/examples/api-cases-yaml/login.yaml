基础配置:
  用例类型: ApiCase
  用例标题: 商城登录用例标题
  一级模块: 登录模块
  二级模块: 登录功能

用例步骤:
  - 发送登陆接口:
      操作类型: 发送请求POST
      请求地址: '{{URL}}'
      URL参数:
        s: /api/user/login
        application: app
        application_client_type: weixin
      请求头:
        Content-Type: application/x-www-form-urlencoded
      请求数据:
        accounts: youyi
        pwd: "123456"
        type: username
